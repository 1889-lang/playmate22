<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Warm Orange to Amber -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D00" />
      <stop offset="60%" stop-color="#FF931F" />
      <stop offset="100%" stop-color="#FFA034" />
    </linearGradient>

    <!-- Top Highlight Gradient for App Squircle -->
    <linearGradient id="squircleHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Ambient Inner Shadow -->
    <radialGradient id="innerShade" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#C2410C" stop-opacity="0" />
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0.28" />
    </radialGradient>

    <!-- Calendar Card Drop Shadow -->
    <filter id="calShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#9A3412" flood-opacity="0.25" />
    </filter>

    <!-- Calendar Header Tear-off Bar Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FA8C16" />
    </linearGradient>

    <!-- Sprout Leaf Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Binder Ring Metallic Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFECC8" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#059669" flood-opacity="0.25" />
    </filter>

    <!-- Clip Path for Calendar Upper Strip -->
    <clipPath id="calClip">
      <rect x="96" y="118" width="320" height="308" rx="42" />
    </clipPath>
  </defs>

  <!-- 1. Background Squircle (rx 24% = 122.88px) -->
  <rect width="512" height="512" rx="122.88" fill="url(#bgGrad)" />

  <!-- Background Inner Shadow -->
  <rect width="512" height="512" rx="122.88" fill="url(#innerShade)" />

  <!-- Squircle Border Highlight & Top Bevel -->
  <rect x="6" y="6" width="500" height="500" rx="116.88" fill="none" stroke="url(#squircleHighlight)" stroke-width="3.5" />

  <!-- 2. Main Calendar Body Card -->
  <!-- Card Background with Shadow -->
  <rect x="96" y="118" width="320" height="308" rx="42" fill="#FFFDF9" filter="url(#calShadow)" />

  <!-- Calendar Top Tear-Off Header Bar -->
  <g clip-path="url(#calClip)">
    <rect x="96" y="118" width="320" height="74" fill="url(#headerGrad)" />
    <!-- Small stitched dash line below header bar -->
    <line x1="112" y1="192" x2="400" y2="192" stroke="#FDE68A" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 3. Calendar Binder Rings & Tear-off Axis -->
  <!-- Left Binder Punch Hole & Ring -->
  <rect x="168" y="100" width="28" height="52" rx="14" fill="url(#ringGrad)" stroke="#EA580C" stroke-width="2.5" />
  <circle cx="182" cy="148" r="5" fill="#C2410C" />

  <!-- Right Binder Punch Hole & Ring -->
  <rect x="316" y="100" width="28" height="52" rx="14" fill="url(#ringGrad)" stroke="#EA580C" stroke-width="2.5" />
  <circle cx="330" cy="148" r="5" fill="#C2410C" />

  <!-- 4. Baby Smiley Face & Playful Central Art -->
  <g id="babyFace">
    <!-- Smiling Eyes (Happy Arches) -->
    <path d="M 184 256 C 184 240 212 240 212 256" fill="none" stroke="#572E14" stroke-width="10" stroke-linecap="round" />
    <path d="M 300 256 C 300 240 328 240 328 256" fill="none" stroke="#572E14" stroke-width="10" stroke-linecap="round" />

    <!-- Cute Blush Circles -->
    <ellipse cx="174" cy="280" rx="14" ry="9" fill="#FF8C72" opacity="0.36" />
    <ellipse cx="338" cy="280" rx="14" ry="9" fill="#FF8C72" opacity="0.36" />

    <!-- Cheerful Baby Smile Arc -->
    <path d="M 230 284 Q 256 318 282 284" fill="none" stroke="#572E14" stroke-width="9" stroke-linecap="round" />
    <!-- Cute Smile Tongue -->
    <path d="M 242 294 Q 256 318 270 294 Z" fill="#FF6B6B" opacity="0.9" />
  </g>

  <!-- 5. Interactive/Playful Calendar Page Flip (Bottom-Right Fold) -->
  <g id="calendarFlip">
    <!-- Behind-the-fold drop shadow -->
    <path d="M 364 426 L 416 374 L 416 426 Z" fill="#000000" opacity="0.08" />
    <!-- The folded dog-ear triangle -->
    <path d="M 368 426 L 416 378 L 382 378 C 374 378 368 384 368 392 Z" fill="#FBF3E8" stroke="#E6DAC8" stroke-width="1.5" />
  </g>

  <!-- 6. Growth Companionship Sprout & Star Accent (Bottom Right) -->
  <g id="growthAccent" filter="url(#starGlow)" transform="translate(356, 334)">
    <!-- Little Soil / Base Mound -->
    <ellipse cx="32" cy="54" rx="14" ry="4" fill="#E2E8F0" opacity="0.4" />
    
    <!-- Sprout Stem -->
    <path d="M 32 52 Q 32 38 30 28" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Left Leaf (Growing sprout) -->
    <path d="M 30 36 C 18 36 14 26 26 22 C 32 20 31 30 30 36 Z" fill="url(#sproutGrad)" />
    
    <!-- Right Leaf -->
    <path d="M 31 30 C 44 26 48 16 36 14 C 28 13 29 24 31 30 Z" fill="url(#sproutGrad)" />
    
    <!-- Sparkle Star of Growth (✨) -->
    <path d="M 46 6 Q 47 14 55 15 Q 47 16 46 24 Q 45 16 37 15 Q 45 14 46 6 Z" fill="#FBBF24" />
    <circle cx="46" cy="15" r="2" fill="#FFFFFF" />
  </g>
</svg>
